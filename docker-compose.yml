services:
  gateway:
    build: .
    env_file: .env
    environment:
      GATEWAY_DB: /data/gateway.db         # database, its key file and backups all live in /data
      SEED_SOURCES_DIR: /data/sources/it   # only used with SEED_DEMO=1; the code folder is read-only
      TRUSTED_PROXIES: 127.0.0.1,::1,172.28.0.0/24  # only Caddy, on the backend network below, may forward client addresses
    volumes:
      - data:/data
      - ./sources:/sources:ro  # folders for "folder" knowledge sources, e.g. /sources/it
    # No "ports:": the gateway is reachable only through Caddy. It believes X-Forwarded-For only from
    # TRUSTED_PROXIES (the backend subnet), so nothing else may share that network or reach 8080.
    expose:
      - "8080"
    networks:
      - backend
    read_only: true            # the container can write only to /data and /tmp
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    restart: unless-stopped
    # healthcheck comes from the Dockerfile (GET /health every 30s)

  # Front door. SITE_ADDRESS=ai.example.com gets automatic HTTPS; default :80 is plain HTTP for the office network.
  caddy:
    image: caddy:2@sha256:3422ce6de165df66534f9b9ba50efaf457114ec961763cc52f5dbdaac2972d73  # caddy:2 (2.11.x)
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificates
      - caddy_config:/config
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE       # listen on 80/443
    pids_limit: 256
    mem_limit: 256m
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

# One private network for Caddy <-> gateway. Not "internal: true": the gateway must reach the
# AI providers and MCP servers on the internet. Limit that outbound traffic at the host/cloud firewall.
networks:
  backend:
    ipam:
      config:
        - subnet: 172.28.0.0/24  # must match TRUSTED_PROXIES above

volumes:
  data:
  caddy_data:
  caddy_config:
