<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>צ'אט AI</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { height: 100vh; overflow: hidden; }
  .wrapper { height: 100vh; }
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login { width: min(400px, 100%); display: grid; gap: 14px; padding: 2rem; }
  .login .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.15rem; color: var(--ink); }
  .login .brand .logo { width: 32px; height: 32px; border-radius: .3rem; background: var(--accent); display: grid; place-items: center; color: #fff; font-size: .8rem; }

  .sidebar { min-height: 0; }
  .side-actions { padding: 0 1.5rem 1rem; display: grid; gap: 12px; }
  .side-actions button { justify-content: center; }
  .who-pick { display: grid; gap: 4px; color: var(--sidebar-header); font-size: .75rem; }
  .who-pick select { background: rgba(255, 255, 255, .06); color: #f8f9fa; border-color: rgba(255, 255, 255, .15); }
  .who-pick select option { color: #212529; background: #fff; }
  .convs { flex: 1; overflow-y: auto; min-height: 0; }
  .conv { display: flex; align-items: center; border-inline-start: 3px solid transparent; }
  .conv button { min-height: 0; box-shadow: none; }
  .conv button.open { flex: 1; min-width: 0; background: none; border: 0; border-radius: 0; color: var(--sidebar-ink); padding: .55rem .5rem .55rem 0; padding-inline-start: 1.625rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; display: block; text-align: start; font-weight: 700; }
  .conv button.open:hover { color: var(--sidebar-ink-hover); background: none; }
  .conv.on { border-inline-start-color: var(--accent); background: linear-gradient(to left, rgba(59, 125, 221, .1), rgba(59, 125, 221, .0875) 50%, rgba(0, 0, 0, 0)); }
  .conv.on button.open { color: var(--sidebar-ink-active); }
  .conv button.del { background: none; border: 0; color: var(--sidebar-ink); padding: 4px 12px; visibility: hidden; }
  .conv:hover button.del { visibility: visible; }
  .conv button.del:hover { color: #fff; background: none; }
  .side-foot { border-top: 1px solid rgba(255, 255, 255, .08); padding: 1rem 1.5rem; display: grid; gap: 12px; color: var(--sidebar-ink-active); }
  .side-foot .meter .label, .side-foot .muted { color: var(--sidebar-header); }
  .side-foot .meter .label .num:first-child { color: #f8f9fa; }
  .side-foot .meter .track { background: rgba(255, 255, 255, .1); }
  .side-foot button.link { color: #9cc2f5; }
  .sidebar .muted { color: var(--sidebar-header); }
  .who { display: flex; justify-content: space-between; align-items: baseline; }

  .main { min-height: 0; }
  .navbar h1 { font-size: 1rem; font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .scroll { flex: 1; overflow-y: auto; }
  .thread { padding: 1.5rem 2.5rem .75rem; display: grid; gap: 1.25rem; }
  .msg { line-height: 1.7; overflow-wrap: anywhere; color: var(--ink); }
  .msg.user { justify-self: start; max-width: 85%; background: var(--accent); color: #fff; padding: .6rem 1rem; border-radius: .5rem; border-start-start-radius: .15rem; white-space: pre-wrap; }
  .msg.assistant { background: var(--surface); box-shadow: var(--shadow); border-radius: var(--radius); padding: 1rem 1.25rem; }
  .msg.assistant p { margin: 0 0 10px; white-space: pre-wrap; }
  .msg.assistant p:last-child { margin-bottom: 0; }
  .msg.assistant code { background: var(--surface-2); padding: 1px 5px; border-radius: .2rem; font: 13px ui-monospace, Consolas, monospace; }
  .msg.assistant pre { max-height: none; }
  .msg .meta { font-size: .75rem; color: var(--title); font-weight: 600; margin-bottom: 6px; }
  .msg.error { color: var(--danger); background: var(--danger-soft); padding: .75rem 1rem; border-radius: var(--radius); }
  .cursor::after { content: "▍"; animation: blink 1s steps(2) infinite; color: var(--muted); }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor::after { animation: none; } }

  .welcome { text-align: center; padding: 12vh 20px 0; display: grid; gap: 12px; justify-items: center; }
  .welcome .stat { width: 56px; height: 56px; }
  .welcome .stat .icon { width: 26px; height: 26px; }
  .welcome h2 { font-size: 1.75rem; font-weight: 400; }
  .welcome p { max-width: 480px; margin: 0; }

  .composer-wrap { padding: .75rem 2.5rem 1.25rem; }
  .composer { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: .75rem; display: grid; gap: 8px; border: 1px solid transparent; }
  .composer:focus-within { border-color: #9dbeee; box-shadow: 0 0 0 .2rem rgba(59, 125, 221, .25); }
  .composer textarea { border: 0; box-shadow: none !important; resize: none; padding: 6px 8px; max-height: 220px; background: transparent; color: var(--ink); }
  .picker { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 0 4px; font-size: .8125rem; color: var(--muted); }
  .chip { min-height: 28px; background: var(--surface); color: var(--body); border: 1px solid var(--axis); border-radius: 999px; padding: .2rem .8rem; font-size: .8125rem; font-weight: 600; box-shadow: none; }
  @media (pointer: coarse) { .chip { min-height: 40px; padding-inline: 1rem; } }
  .chip:hover { background: var(--surface-2); color: var(--ink); border-color: var(--muted); box-shadow: none; }
  .chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .msg .used { font-size: .75rem; color: var(--muted); margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .composer .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .composer select { font-size: .8125rem; }
  .hint { margin: 8px 0 0; text-align: center; font-size: .75rem; color: var(--muted); }

  @media (max-width: 991px) {
    .thread, .composer-wrap { padding-inline: 1rem; }
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" hidden>
  <symbol id="i-menu" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
</svg>

<div class="login-wrap" id="loginView" hidden>
  <form class="card login" id="loginForm">
    <div class="brand"><span class="logo">AI</span>צ'אט AI של החברה</div>
    <label class="field">שם משתמש<input type="text" id="lName" autocomplete="username" required></label>
    <label class="field">סיסמה<input type="password" id="lPass" autocomplete="current-password" required></label>
    <button>כניסה</button>
    <p class="error" id="loginError"></p>
    <p class="muted small" style="margin:0">אין לך משתמש? פנה למנהל המערכת.</p>
  </form>
</div>

<div class="wrapper" id="appView" hidden>
  <nav class="sidebar" id="sidebar" aria-label="שיחות">
    <a class="sidebar-brand" href="/"><span class="logo">AI</span>צ'אט AI</a>
    <div class="side-actions">
      <label class="who-pick" id="whoPick" hidden>אני
        <select id="who" aria-label="בחירת השם שלי"></select>
      </label>
      <button id="newChat"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>שיחה חדשה</button>
    </div>
    <div class="sidebar-header" style="padding-top:.5rem">שיחות</div>
    <div class="convs" id="convs"></div>
    <a class="sidebar-link" href="/admin" style="border-top:1px solid rgba(255,255,255,.08)"><svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg><span>ניהול המערכת</span></a>
    <a class="sidebar-link" href="/docs"><svg class="icon" aria-hidden="true"><use href="#i-help"/></svg><span>עזרה ותיעוד</span></a>
    <div class="side-foot" id="sideFoot">
      <div class="who"><b id="meName"></b><span class="muted small" id="meTeam"></span></div>
      <div id="meBudget"></div>
      <div class="row spread" id="pwLinks">
        <button class="link small" id="changePw">החלפת סיסמה</button>
        <button class="link small" id="logout">יציאה</button>
      </div>
    </div>
  </nav>

  <section class="main">
    <header class="navbar">
      <button class="toggle" id="menu" aria-label="הצגה או הסתרה של התפריט"><svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg></button>
      <h1 id="convTitle">שיחה חדשה</h1>
      <div class="navbar-end"><span class="muted small" id="topWho"></span></div>
    </header>
    <div class="scroll" id="scroll">
      <div class="welcome" id="welcome">
        <div class="stat"><svg class="icon" aria-hidden="true"><use href="#i-chat"/></svg></div>
        <h2 id="welcomeTitle">במה אפשר לעזור?</h2>
        <p class="muted" id="welcomeText">השאלות נשמרות ומתועדות. מספרי תעודת זהות, כרטיסי אשראי ומפתחות גישה מוסתרים אוטומטית לפני שהם נשלחים.</p>
      </div>
      <div class="thread" id="thread"></div>
    </div>
    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="input" rows="1" aria-label="ההודעה שלך" placeholder="כתבו הודעה… (Enter לשליחה, Shift+Enter לשורה חדשה)" dir="auto"></textarea>
        <div class="picker" id="picker" hidden></div>
        <div class="bar">
          <select id="model" aria-label="מודל"></select>
          <button id="send"><svg class="icon" aria-hidden="true"><use href="#i-send"/></svg><span id="sendLabel">שליחה</span></button>
        </div>
      </form>
      <p class="hint" id="budgetHint"></p>
    </div>
  </section>
</div>

<dialog id="pwDialog">
  <form id="pwForm">
    <h2>החלפת סיסמה</h2>
    <label class="field">סיסמה נוכחית<input type="password" id="pwOld" autocomplete="current-password" required></label>
    <label class="field">סיסמה חדשה (לפחות 8 תווים)<input type="password" id="pwNew" autocomplete="new-password" minlength="8" required></label>
    <p class="error" id="pwError"></p>
    <div class="row"><button>שמירה</button><button type="button" class="ghost" data-close>ביטול</button></div>
  </form>
</dialog>

<script src="/ui.js"></script>
<script src="/chat.js"></script>
</body>
</html>
