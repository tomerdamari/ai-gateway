<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FireGate · צ'אט</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<script src="/en-admin.js"></script>
<script src="/en-chat.js"></script>
<script src="/i18n.js"></script>
<style>
  body { height: 100vh; height: 100dvh; overflow: hidden; }
  .wrapper { height: 100vh; height: 100dvh; }
  .welcome-pick { min-width: min(280px, 100%); text-align: start; margin-top: .5rem; }
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .login { width: min(400px, 100%); display: grid; gap: 14px; padding: 2rem; }
  .login .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.15rem; color: var(--ink); }
  .login .brand .logo { width: 36px; height: 36px; display: block; }

  .sidebar { min-height: 0; }
  .side-actions { padding: 0 1.25rem 1rem; display: grid; gap: 12px; }
  .side-actions button { justify-content: center; background: #fff; color: #18181b; border-color: #fff; }
  .side-actions button:hover { background: #e9e9eb; border-color: #e9e9eb; }
  .who-pick { display: grid; gap: 6px; color: var(--sidebar-header); font-size: .75rem; font-weight: 600; }
  .who-pick select { background: rgba(255, 255, 255, .06); color: #f7f7f7; border-color: rgba(255, 255, 255, .18); }
  .who-pick select option { color: #18181b; background: #fff; }
  .sidebar .sidebar-header { padding-inline: 1.75rem 1.25rem; }
  .convs { flex: 1; overflow-y: auto; min-height: 0; padding-bottom: .75rem; }
  .conv { display: flex; align-items: center; margin-inline: .75rem; border-radius: var(--radius-sm); transition: background var(--dur) var(--ease); }
  .conv + .conv { margin-top: 2px; }
  .conv:hover { background: rgba(255, 255, 255, .06); }
  .conv button { min-height: 0; box-shadow: none; }
  .conv button.open { flex: 1; min-width: 0; min-height: 40px; background: none; border: 0; border-radius: var(--radius-sm); color: var(--sidebar-ink); padding-block: 0; padding-inline: 1rem 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; display: block; text-align: start; font-weight: 500; }
  .conv button.open:hover { color: var(--sidebar-ink-hover); background: none; }
  .conv.on { background: rgba(255, 255, 255, .12); }
  .conv.on button.open { color: var(--sidebar-ink-active); font-weight: 600; }
  .conv button.del { background: none; border: 0; color: var(--sidebar-ink); padding: 4px 12px; visibility: hidden; border-radius: var(--radius-sm); }
  .conv:hover button.del, .conv:focus-within button.del, .conv button.del.keep { visibility: visible; }
  .sidebar-header button.link { color: var(--sidebar-ink); font-size: .75rem; font-weight: 600; }
  .conv button.del:hover { color: #fff; background: none; }
  .side-links { border-top: 1px solid rgba(255, 255, 255, .08); padding-top: .75rem; }
  .side-foot { border-top: 1px solid rgba(255, 255, 255, .08); margin-top: .75rem; padding: 1rem 1.5rem 1.25rem; display: grid; gap: 12px; color: var(--sidebar-ink-active); }
  .side-foot .meter .label, .side-foot .muted { color: var(--sidebar-header); }
  .side-foot .meter .label .num:first-child { color: #f7f7f7; }
  .side-foot .meter .track { background: rgba(255, 255, 255, .12); }
  .side-foot .meter .fill { background: #fff; }
  .side-foot .meter.warn .fill { background: var(--warning); }
  .side-foot .meter.bad .fill { background: var(--danger); }
  .side-foot button.link { color: #ffffff; text-decoration: underline; }
  .sidebar .muted { color: var(--sidebar-header); }
  .who { display: flex; justify-content: space-between; align-items: baseline; }

  .main { min-height: 0; }
  .navbar h1 { font-size: 1rem; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .scroll { flex: 1; overflow-y: auto; }
  .thread { padding: 1rem 2.5rem .75rem; display: grid; gap: 1.25rem; max-width: 920px; width: 100%; margin-inline: auto; }
  .msg { line-height: 1.75; overflow-wrap: anywhere; color: var(--ink); }
  .msg.user { justify-self: start; max-width: 85%; background: var(--accent); color: var(--accent-ink); padding: .7rem 1.1rem; border-radius: var(--radius); border-start-start-radius: 6px; white-space: pre-wrap; }
  .msg.assistant { background: var(--surface); box-shadow: var(--shadow); border-radius: var(--radius); padding: 1.25rem 1.5rem; }
  .msg.assistant p { margin: 0 0 10px; white-space: pre-wrap; }
  .msg.assistant p:last-child { margin-bottom: 0; }
  .msg.assistant code { background: var(--surface-2); padding: 1px 6px; border-radius: 6px; font: 13px ui-monospace, Consolas, monospace; }
  .msg.assistant pre { max-height: none; }
  .msg .meta { font-size: .75rem; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
  .msg.error { color: var(--danger-ink); background: var(--danger-soft); padding: .875rem 1.1rem; border-radius: var(--radius-sm); }
  .cursor::after { content: "▍"; animation: blink 1s steps(2) infinite; color: var(--muted); }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor::after { animation: none; } }

  .welcome { text-align: center; padding: 10vh 20px 0; display: grid; gap: 12px; justify-items: center; }
  .welcome .stat { width: 64px; height: 64px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
  .welcome .stat .icon { width: 28px; height: 28px; }
  .welcome h2 { font-size: 2rem; font-weight: 800; letter-spacing: -.02em; }
  .welcome p { max-width: 480px; margin: 0; }

  .composer-wrap { padding: .75rem 2.5rem 1.25rem; max-width: 920px; width: 100%; margin-inline: auto; }
  .composer { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: .875rem; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; border: 2px solid transparent; transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
  .composer:focus-within { border-color: var(--focus); box-shadow: var(--shadow-elevated); }
  .composer textarea { border: 0; box-shadow: none !important; outline: none !important; resize: none; padding: 6px 8px; max-height: 220px; background: transparent; color: var(--ink); font-size: 1rem; }
  .picker { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 0 4px; font-size: .8125rem; color: var(--muted); }
  .chip { min-height: 32px; background: var(--surface); color: var(--body); border: 1px solid var(--line); border-radius: 999px; padding: 0 .9rem; font-size: .8125rem; font-weight: 600; box-shadow: none; }
  @media (pointer: coarse) { .chip { min-height: 40px; padding-inline: 1rem; } }
  .chip:hover { background: var(--surface-2); color: var(--ink); border-color: var(--axis); box-shadow: none; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .msg .used { font-size: .75rem; color: var(--muted); margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .composer .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-width: 0; }
  .composer select { font-size: .8125rem; min-height: 40px; border-color: var(--line); background: var(--surface-2); min-width: 0; flex: 0 1 auto; width: auto; max-width: 100%; }
  [dir="rtl"] #send .icon { transform: scaleX(-1); }
  .hint { margin: 8px 0 0; text-align: center; font-size: .75rem; color: var(--muted); }

  @media (max-width: 991px) {
    .thread, .composer-wrap { padding-inline: 1rem; }
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" hidden>
  <symbol id="i-menu" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></symbol>
  <symbol id="i-archive" viewBox="0 0 24 24"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></symbol>
  <symbol id="i-restore" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
</svg>

<div class="login-wrap" id="loginView" hidden>
  <form class="card login" id="loginForm">
    <div class="brand"><img class="logo" src="/logo.svg" alt="">FireGate · הצ'אט של החברה</div>
    <label class="field">שם משתמש<input type="text" id="lName" autocomplete="username" required></label>
    <label class="field">סיסמה<input type="password" id="lPass" autocomplete="current-password" required></label>
    <button>כניסה</button>
    <p class="error" id="loginError"></p>
    <p class="muted small" style="margin:0">אין לך משתמש? פנה למנהל המערכת.</p>
  </form>
</div>

<div class="wrapper" id="appView" hidden>
  <nav class="sidebar" id="sidebar" aria-label="שיחות">
    <a class="sidebar-brand" href="/chat"><img class="logo" src="/logo.svg" alt="">FireGate</a>
    <div class="side-actions">
      <label class="who-pick" id="whoPick" hidden>אני
        <select id="who" aria-label="בחירת השם שלי"></select>
      </label>
      <button id="newChat"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>שיחה חדשה</button>
    </div>
    <div class="sidebar-header row spread" style="padding-top:.25rem"><span id="convsTitle">שיחות</span><button class="link small" id="archiveToggle">ארכיון</button></div>
    <div class="convs" id="convs"></div>
    <div class="side-links">
    <a class="sidebar-link" href="/"><svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg><span>ניהול המערכת</span></a>
    <a class="sidebar-link" href="/docs"><svg class="icon" aria-hidden="true"><use href="#i-help"/></svg><span>עזרה ותיעוד</span></a>
    </div>
    <div class="side-foot" id="sideFoot">
      <div class="who"><b id="meName"></b><span class="muted small" id="meTeam"></span></div>
      <div id="meBudget"></div>
      <div class="row spread" id="pwLinks">
        <button class="link small" id="changePw">החלפת סיסמה</button>
        <button class="link small" id="logout">יציאה</button>
      </div>
    </div>
  </nav>

  <section class="main">
    <header class="navbar">
      <button class="toggle" id="menu" aria-label="הצגה או הסתרה של התפריט"><svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg></button>
      <h1 id="convTitle">שיחה חדשה</h1>
      <div class="navbar-end"><button class="ghost sm lang-switch" data-lang-switch lang="en">English</button><span class="muted small" id="topWho"></span></div>
    </header>
    <div class="scroll" id="scroll">
      <div class="welcome" id="welcome">
        <div class="stat"><svg class="icon" aria-hidden="true"><use href="#i-chat"/></svg></div>
        <h2 id="welcomeTitle">במה אפשר לעזור?</h2>
        <p class="muted" id="welcomeText">השאלות נשמרות ומתועדות. מספרי תעודת זהות, כרטיסי אשראי ומפתחות גישה מוסתרים אוטומטית לפני שהם נשלחים.</p>
        <label class="field welcome-pick" id="welcomePick" hidden>השם שלי<select id="who2"></select></label>
      </div>
      <div class="thread" id="thread"></div>
    </div>
    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="input" rows="1" aria-label="ההודעה שלך" placeholder="כתבו הודעה… (Enter לשליחה, Shift+Enter לשורה חדשה)" dir="auto"></textarea>
        <div class="picker" id="picker" hidden></div>
        <div class="bar">
          <select id="model" aria-label="מודל"></select>
          <button id="send"><svg class="icon" aria-hidden="true"><use href="#i-send"/></svg><span id="sendLabel">שליחה</span></button>
        </div>
      </form>
      <p class="hint" id="budgetHint"></p>
    </div>
  </section>
</div>

<dialog id="pwDialog">
  <form id="pwForm">
    <h2>החלפת סיסמה</h2>
    <label class="field">סיסמה נוכחית<input type="password" id="pwOld" autocomplete="current-password" required></label>
    <label class="field">סיסמה חדשה (לפחות 8 תווים)<input type="password" id="pwNew" autocomplete="new-password" minlength="8" required></label>
    <p class="error" id="pwError"></p>
    <div class="row"><button>שמירה</button><button type="button" class="ghost" data-close>ביטול</button></div>
  </form>
</dialog>

<script src="/ui.js"></script>
<script src="/chat.js"></script>
</body>
</html>
